 fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1440" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1900" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><path d="M 460 465 L 505.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 460 465 L 505.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 515.53 465 L 505.53 470 L 505.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 920 465 L 965.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 920 465 L 965.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 975.53 465 L 965.53 470 L 965.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1380 465 L 1425.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1380 465 L 1425.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1435.53 465 L 1425.53 470 L 1425.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1840 465 L 1885.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1840 465 L 1885.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1895.53 465 L 1885.53 470 L 1885.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><rect x="60" y="680" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="680" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="520" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="980" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1440" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1900" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><path d="M 520 867.5 L 474.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 520 867.5 L 474.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 464.47 867.5 L 474.47 862.5 L 474.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 980 867.5 L 934.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 980 867.5 L 934.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 924.47 867.5 L 934.47 862.5 L 934.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1440 867.5 L 1394.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1440 867.5 L 1394.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1384.47 867.5 L 1394.47 862.5 L 1394.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1900 867.5 L 1854.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1900 867.5 L 1854.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1844.47 867.5 L 1854.47 862.5 L 1854.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><rect x="60" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#f2f0fa" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="840" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#fff7e7" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1620" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#fff0ef" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1470" width="2280" height="40" rx="3.2" ry="3.2" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1470" width="2280" height="40" rx="3.2" ry="3.2" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1520" width="2280" height="105" rx="8.4" ry="8.4" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1520" width="2280" height="105" rx="8.4" ry="8.4" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1660" width="2280" height="45" rx="3.6" ry="3.6" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1660" width="2280" height="45" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g></g><g/><g/></g><text x="60" y="52.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">AWS / PACKET INSPECTION ATLAS / 11 OF 12</text><text x="60" y="125.31" font-family="Arial" font-size="44px" font-weight="400" fill="rgb(21, 40, 63)">GWLB overlay routing — vendor DMZ variant</text><text x="60" y="194.3" font-family="Arial" font-size="26px" font-weight="400" fill="rgb(21, 40, 63)">VM-Series-specific architecture • not a universal GWLB feature</text><text x="60" y="262.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">FORWARD → Read steps 1–5 from left to right</text><text x="82" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">01 Ingress endpoint</text><text x="82" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">AWS route selection sends the</text><text x="82" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">flow to the designated GWLBE.</text><text x="82" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Endpoint identity identifies the</text><text x="82" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">service-chain entry context.</text><text x="542" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">02 GENEVE delivery</text><text x="542" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">GWLB carries the original</text><text x="542" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">packet and service metadata to</text><text x="542" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">VM-Series. Vendor</text><text x="542" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">plugin/configuration maps</text><text x="542" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">supported endpoint context to</text><text x="542" y="526.984375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">the intended zone.</text><text x="1002" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">03 Inner-header routing</text><text x="1002" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">With the supported overlay-</text><text x="1002" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">routing feature configured, PAN-</text><text x="1002" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">OS performs an inner-packet</text><text x="1002" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">route lookup and security policy</text><text x="1002" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">processing.</text><text x="1462" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">04 DMZ / trust egress</text><text x="1462" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The appliance forwards to the</text><text x="1462" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">configured routed destination</text><text x="1462" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">instead of assuming every</text><text x="1462" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">design is simple transparent</text><text x="1462" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">return-to-source-endpoint</text><text x="1462" y="526.984375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">inspection.</text><text x="1922" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">05 Application</text><text x="1922" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The backend receives the</text><text x="1922" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">selected translated or original</text><text x="1922" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">tuple. Its return route must lead</text><text x="1922" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">into the correct vendor session</text><text x="1922" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">and zone context.</text><text x="60" y="702.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">RETURN ← Start at step 6 on the right; follow steps 6–10 back to the source</text><text x="82" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">10 Original client</text><text x="82" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">Reverse NAT/session</text><text x="82" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">processing restores the</text><text x="82" y="893.435" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">expected service tuple.</text><text x="542" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">09 AWS egress path</text><text x="542" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">The supported vendor/AWS</text><text x="542" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">design delivers the response</text><text x="542" y="893.435" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">through the correct</text><text x="542" y="921.02875" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">endpoint/public path.</text><text x="1002" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">08 Vendor session</text><text x="1002" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">PAN-OS matches security</text><text x="1002" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">zones, routing and NAT state.</text><text x="1462" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">07 DMZ return route</text><text x="1462" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">The backend reaches the</text><text x="1462" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">correct inspection interface or</text><text x="1462" y="893.435" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">endpoint path.</text><text x="1922" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">06 Backend reply</text><text x="1922" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">A generic GWLB stickiness</text><text x="1922" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">claim does not establish this</text><text x="1922" y="893.435" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">routed return design.</text><text x="82" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">ROUTING / CONTROL PLANE</text><text x="82" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Treat endpoint-to-zone mapping, plugin/version</text><text x="82" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">requirements and the PAN-OS virtual-router</text><text x="82" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">configuration as mandatory prerequisites. TGW</text><text x="82" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Connect GRE/BGP is a separate overlay mechanism.</text><text x="862" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">INSPECTION / IDENTITY</text><text x="862" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">The earlier knowledge material includes this vendor-</text><text x="862" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">specific case. Validate against the selected VM-Series</text><text x="862" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">release rather than translating it to another vendor or</text><text x="862" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">enabling it on a basic transparent lab.</text><text x="1642" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">FAILURE / PROOF</text><text x="1642" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Record endpoint ID, ingress zone, inner destination,</text><text x="1642" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">chosen route, egress zone and NAT rule for both</text><text x="1642" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">directions. Test an explicit DMZ deny and session</text><text x="1642" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">recovery after target failure.</text><text x="60" y="1492.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">REFERENCES — full clickable source links and validation commands are in the companion Markdown report.</text><text x="60" y="1539.44" font-family="Arial" font-size="21px" font-weight="400" fill="rgb(0, 0, 238)">https://docs.paloaltonetworks.com/vm-series/11-1/vm-series-deployment/set-up-the-vm-series-firewall-on-aws/vm-series-integration-with-gateway-load-balancer</text><text x="60" y="1680.25" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Illustrative addresses • logical service hops • blue = initiating traffic • green = response • control-plane notes are not packet hops</text></svg>