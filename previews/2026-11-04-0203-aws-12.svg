 ry="3.6" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1620" width="2280" height="60" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g></g><g/><g/></g><text x="60" y="86.31" font-family="Arial" font-size="44px" font-weight="400" fill="rgb(21, 40, 63)">AWS — native Terraform lab topology</text><text x="60" y="168.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Concrete resource boundaries and route ownership • blue = initiating packet • green = reply • purple dashed = policy/control</text><text x="70" y="288.35" font-family="Arial" font-size="30px" font-weight="400" fill="rgb(21, 40, 63)">LAB VPC 10.10.0.0/16 — one Availability Zone</text><text x="110" y="373.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">WORKLOAD SUBNET 10.10.1.0/24</text><text x="880" y="373.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">FIREWALL SUBNET 10.10.2.0/24</text><text x="1650" y="373.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">PUBLIC NAT SUBNET 10.10.3.0/24</text><text x="170" y="483.49" font-family="Arial" font-size="25px" font-weight="700" fill="rgb(21, 40, 63)">Private EC2 / SSM</text><text x="170" y="513.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">t3.micro • no inbound SG rule</text><text x="170" y="543.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">TCP/80 and TCP/443 test traffic</text><text x="1001.5" y="503.99" font-family="Arial" font-size="25px" font-weight="700" fill="rgb(21, 40, 63)">Network Firewall endpoint</text><text x="1003" y="533.99" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Same-AZ managed inspection</text><text x="1024" y="563.99" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Original source before NAT</text><text x="1710" y="483.49" font-family="Arial" font-size="25px" font-weight="700" fill="rgb(21, 40, 63)">NAT Gateway</text><text x="1710" y="513.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Public EIP owns translation</text><text x="1710" y="543.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Private workload source → EIP</text><text x="170" y="763.49" font-family="Arial" font-size="25px" font-weight="700" fill="rgb(21, 40, 63)">Workload route table</text><text x="170" y="793.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">0.0.0.0/0 → firewall endpoint</text><text x="170" y="823.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">VPC local route unchanged</text><text x="170" y="853.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">SG allows egress; no ingress opening</text><text x="940" y="763.49" font-family="Arial" font-size="25px" font-weight="700" fill="rgb(21, 40, 63)">Endpoint route table</text><text x="940" y="793.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">0.0.0.0/0 → NAT Gateway</text><text x="940" y="823.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">10.10.0.0/16 → local</text><text x="940" y="853.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">After inspection, continue onward</text><text x="1710" y="763.49" font-family="Arial" font-size="25px" font-weight="700" fill="rgb(21, 40, 63)">NAT subnet route table</text><text x="1710" y="793.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">0.0.0.0/0 → IGW</text><text x="1710" y="823.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">10.10.1.0/24 → firewall endpoint</text><text x="1710" y="853.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Return is inspected after reverse NAT</text><text x="703" y="490.5625" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(36, 102, 168)">1 • endpoint route</text><text x="1498.5" y="490.5625" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(36, 102, 168)">2 • post route</text><text x="1488.5" y="575.5625" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(37, 130, 91)">5 • reverse NAT</text><text x="711.5" y="575.5625" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(37, 130, 91)">6 • stateful reply</text><text x="110" y="1193.49" font-family="Arial" font-size="25px" font-weight="700" fill="rgb(21, 40, 63)">Policy and evidence</text><text x="110" y="1223.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Stateless defaults → stateful engine</text><text x="110" y="1253.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Strict order; transport allows TCP/80 and TCP/443</text><text x="110" y="1283.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Drop-established default for other established traffic</text><text x="110" y="1313.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">CloudWatch FLOW and ALERT logs</text><text x="1410" y="1233.49" font-family="Arial" font-size="25px" font-weight="700" fill="rgb(21, 40, 63)">Internet Gateway</text><text x="1410" y="1263.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">VPC edge</text><text x="1973.5" y="1258.99" font-family="Arial" font-size="25px" font-weight="700" fill="rgb(21, 40, 63)">Internet server</text><text x="1977.5" y="1288.99" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Reply to NAT EIP</text><text x="2122" y="1097.5625" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(36, 102, 168)">3 • public egress</text><text x="1687" y="1272.5625" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(36, 102, 168)">4 • request / response</text><text x="705.5" y="954.5625" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(124, 86, 160)">Policy association</text><text x="60" y="1533.49" font-family="Arial" font-size="25px" font-weight="400" fill="rgb(21, 40, 63)">Use the linked Terraform root and scenario-specific inputs. Resource health, policy hits and a completed packet exchange are separate checks.</text><text x="60" y="1641.06" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">Lab-only reference • no cloud apply performed • public examples and resource names must be replaced with your own test values</text></svg>