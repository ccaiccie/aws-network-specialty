 fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1440" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1900" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><path d="M 460 465 L 505.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 460 465 L 505.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 515.53 465 L 505.53 470 L 505.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 920 465 L 965.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 920 465 L 965.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 975.53 465 L 965.53 470 L 965.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1380 465 L 1425.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1380 465 L 1425.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1435.53 465 L 1425.53 470 L 1425.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1840 465 L 1885.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1840 465 L 1885.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1895.53 465 L 1885.53 470 L 1885.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><rect x="60" y="680" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="680" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="520" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="980" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1440" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1900" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><path d="M 520 867.5 L 474.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 520 867.5 L 474.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 464.47 867.5 L 474.47 862.5 L 474.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 980 867.5 L 934.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 980 867.5 L 934.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 924.47 867.5 L 934.47 862.5 L 934.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1440 867.5 L 1394.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1440 867.5 L 1394.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1384.47 867.5 L 1394.47 862.5 L 1394.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1900 867.5 L 1854.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1900 867.5 L 1854.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1844.47 867.5 L 1854.47 862.5 L 1854.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><rect x="60" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#f2f0fa" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="840" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#fff7e7" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1620" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#fff0ef" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1470" width="2280" height="40" rx="3.2" ry="3.2" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1470" width="2280" height="40" rx="3.2" ry="3.2" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1520" width="2280" height="105" rx="8.4" ry="8.4" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1520" width="2280" height="105" rx="8.4" ry="8.4" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1660" width="2280" height="45" rx="3.6" ry="3.6" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1660" width="2280" height="45" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g></g><g/><g/></g><text x="60" y="52.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">AWS / PACKET INSPECTION ATLAS / 04 OF 12</text><text x="60" y="125.31" font-family="Arial" font-size="44px" font-weight="400" fill="rgb(21, 40, 63)">TGW-attached Network Firewall — managed attachment</text><text x="60" y="194.3" font-family="Arial" font-size="26px" font-weight="400" fill="rgb(21, 40, 63)">Native network-function attachment • different from an inspection VPC</text><text x="60" y="262.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">FORWARD → Read steps 1–5 from left to right</text><text x="82" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">01 Source attachment</text><text x="82" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The spoke forwards toward</text><text x="82" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">TGW. The associated route table</text><text x="82" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">determines whether this flow is</text><text x="82" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">inspected.</text><text x="542" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">02 TGW steering</text><text x="542" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">A route selects the Network</text><text x="542" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Firewall network-function</text><text x="542" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">attachment instead of a</text><text x="542" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">customer inspection VPC</text><text x="542" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">attachment.</text><text x="1002" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">03 Managed firewall</text><text x="1002" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">AWS provisions the integrated</text><text x="1002" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">inspection path and applies the</text><text x="1002" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">firewall policy. The customer</text><text x="1002" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">does not build the traditional</text><text x="1002" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">endpoint-subnet plumbing for</text><text x="1002" y="526.984375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">this attachment.</text><text x="1462" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">04 Post-inspection domain</text><text x="1462" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The firewall attachment's TGW</text><text x="1462" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">route-table association must</text><text x="1462" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">resolve the final destination</text><text x="1462" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">without re-entering the same</text><text x="1462" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">inspection path.</text><text x="1922" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">05 Destination</text><text x="1922" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The remote attachment</text><text x="1922" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">forwards to its workload. The</text><text x="1922" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">response must also be steered</text><text x="1922" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">through the managed firewall</text><text x="1922" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">attachment.</text><text x="60" y="702.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">RETURN ← Start at step 6 on the right; follow steps 6–10 back to the source</text><text x="82" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">10 Source attachment</text><text x="82" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">TGW resolves the original</text><text x="82" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">source after inspection.</text><text x="542" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">09 Post-inspection lookup</text><text x="542" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">The associated table provides</text><text x="542" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">a source route.</text><text x="1002" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">08 Firewall state</text><text x="1002" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">The managed service inspects</text><text x="1002" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">the reverse flow.</text><text x="1462" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">07 Destination TGW table</text><text x="1462" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">The response route selects the</text><text x="1462" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">firewall attachment.</text><text x="1922" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">06 Remote reply</text><text x="1922" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">The same insertion policy</text><text x="1922" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">must hold for the return traffic</text><text x="1922" y="893.435" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">class.</text><text x="82" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">ROUTING / CONTROL PLANE</text><text x="82" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Keep pre-inspection and post-inspection route roles</text><text x="82" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">explicit. Read the service's current regional, account-</text><text x="82" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">sharing and attachment constraints. This is not the</text><text x="82" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">same resource model as firewall endpoints in your own</text><text x="82" y="1277.46125" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">VPC.</text><text x="862" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">INSPECTION / IDENTITY</text><text x="862" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Firewall ownership and TGW ownership can differ</text><text x="862" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">through supported sharing. Policy remains managed by</text><text x="862" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">the firewall owner. Reachability is not evidence that the</text><text x="862" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">TGW route chose the network-function attachment.</text><text x="1642" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">FAILURE / PROOF</text><text x="1642" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Inspect the attachment state, TGW associated tables</text><text x="1642" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">and firewall logs. Test a denied flow and route</text><text x="1642" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">withdrawal. Do not apply VPC appliance-mode</text><text x="1642" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">instructions mechanically to a different attachment</text><text x="1642" y="1277.46125" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">type.</text><text x="60" y="1492.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">REFERENCES — full clickable source links and validation commands are in the companion Markdown report.</text><text x="60" y="1539.44" font-family="Arial" font-size="21px" font-weight="400" fill="rgb(0, 0, 238)">https://docs.aws.amazon.com/network-firewall/latest/developerguide/tgw-firewall.html</text><text x="60" y="1680.25" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Illustrative addresses • logical service hops • blue = initiating traffic • green = response • control-plane notes are not packet hops</text></svg>