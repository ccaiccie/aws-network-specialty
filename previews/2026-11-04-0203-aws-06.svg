<svg style="left: 0px; top: 0px; width: 100%; height: 100%; display: block; min-width: 2341px; min-height: 1706px; background: white;" xmlns="http://www.w3.org/2000/svg" width="2400" height="1740" viewBox="0 0 2400 1740"><g><g/><g><g style="visibility: visible;"><rect x="60" y="30" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="30" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="84" width="2280" height="76" rx="6.08" ry="6.08" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="84" width="2280" height="76" rx="6.08" ry="6.08" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="170" width="2280" height="50" rx="4" ry="4" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="170" width="2280" height="50" rx="4" ry="4" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="240" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="240" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="520" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="980" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1440" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1900" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><path d="M 460 465 L 505.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 460 465 L 505.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 515.53 465 L 505.53 470 L 505.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 920 465 L 965.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 920 465 L 965.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 975.53 465 L 965.53 470 L 965.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1380 465 L 1425.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1380 465 L 1425.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1435.53 465 L 1425.53 470 L 1425.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1840 465 L 1885.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1840 465 L 1885.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1895.53 465 L 1885.53 470 L 1885.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><rect x="60" y="680" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="680" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="520" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="980" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1440" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1900" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><path d="M 520 867.5 L 474.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 520 867.5 L 474.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 464.47 867.5 L 474.47 862.5 L 474.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 980 867.5 L 934.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 980 867.5 L 934.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 924.47 867.5 L 934.47 862.5 L 934.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1440 867.5 L 1394.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1440 867.5 L 1394.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1384.47 867.5 L 1394.47 862.5 L 1394.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1900 867.5 L 1854.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1900 867.5 L 1854.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1844.47 867.5 L 1854.47 862.5 L 1854.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><rect x="60" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#f2f0fa" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="840" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#fff7e7" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1620" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#fff0ef" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1470" width="2280" height="40" rx="3.2" ry="3.2" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1470" width="2280" height="40" rx="3.2" ry="3.2" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1520" width="2280" height="105" rx="8.4" ry="8.4" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1520" width="2280" height="105" rx="8.4" ry="8.4" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1660" width="2280" height="45" rx="3.6" ry="3.6" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1660" width="2280" height="45" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g></g><g/><g/></g><text x="60" y="52.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">AWS / PACKET INSPECTION ATLAS / 06 OF 12</text><text x="60" y="125.31" font-family="Arial" font-size="44px" font-weight="400" fill="rgb(21, 40, 63)">Direct NVA and VPC Route Server</text><text x="60" y="194.3" font-family="Arial" font-size="26px" font-weight="400" fill="rgb(21, 40, 63)">Two variants • static ENI routes or BGP-installed routes</text><text x="60" y="262.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">FORWARD → Read steps 1–5 from left to right</text><text x="82" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">01 Workload route</text><text x="82" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The effective subnet or IGW</text><text x="82" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">route selects the appliance ENI.</text><text x="82" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Static insertion configures that</text><text x="82" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">route directly; dynamic</text><text x="82" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">insertion uses eligible BGP-</text><text x="82" y="526.984375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">learned routes.</text><text x="542" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">02 NVA ingress</text><text x="542" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The appliance accepts transit</text><text x="542" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">traffic with EC2</text><text x="542" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">source/destination checks</text><text x="542" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">disabled on the forwarding</text><text x="542" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">interfaces. SGs must allow the</text><text x="542" y="526.984375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">transport and intended data.</text><text x="1002" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">03 Vendor inspection</text><text x="1002" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The firewall owns security state,</text><text x="1002" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">optional TLS decryption and</text><text x="1002" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">NAT. The cloud next hop does</text><text x="1002" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">not replace the appliance</text><text x="1002" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">routing table.</text><text x="1462" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">04 NVA onward route</text><text x="1462" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The appliance forwards toward</text><text x="1462" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">the destination through an</text><text x="1462" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">appropriate interface/route.</text><text x="1462" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Avoid matching its emitted</text><text x="1462" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">traffic back to itself.</text><text x="1922" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">05 Destination</text><text x="1922" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The remote endpoint responds</text><text x="1922" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">using a route that selects the</text><text x="1922" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">same or supported</text><text x="1922" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">synchronized firewall state.</text><text x="60" y="702.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">RETURN ← Start at step 6 on the right; follow steps 6–10 back to the source</text><text x="82" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">10 Client</text><text x="82" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">The restored flow returns to</text><text x="82" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">the original socket.</text><text x="542" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">09 Appliance route</text><text x="542" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">The NVA resolves the source</text><text x="542" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">prefix after inspection.</text><text x="1002" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">08 NVA state</text><text x="1002" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">Reverse traffic must match</text><text x="1002" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">session and any NAT state.</text><text x="1462" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">07 Return routing</text><text x="1462" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">A static route or learned route</text><text x="1462" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">selects the inspection ENI.</text><text x="1922" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">06 Remote reply</text><text x="1922" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">A BGP failover can move new</text><text x="1922" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">flows while old sessions still</text><text x="1922" y="893.435" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">belong to the failed appliance.</text><text x="82" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">ROUTING / CONTROL PLANE</text><text x="82" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">CONTROL PLANE: NVA BGP → VPC Route Server</text><text x="82" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">endpoint → propagation to associated eligible VPC/IGW</text><text x="82" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">route tables. Route Server is not a data-plane hop and</text><text x="82" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">does not program TGW route tables; TGW Connect is a</text><text x="82" y="1277.46125" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">different feature.</text><text x="862" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">INSPECTION / IDENTITY</text><text x="862" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Static ENI next hops need explicit failover automation.</text><text x="862" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Dynamic routing reduces route-update work, but does</text><text x="862" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">not synchronize state. Do not confuse GWLB overlay</text><text x="862" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">routing with BGP route-server insertion.</text><text x="1642" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">FAILURE / PROOF</text><text x="1642" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Verify peer status, learned route, propagation and</text><text x="1642" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">installed next hop. Withdraw a route and test both new</text><text x="1642" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">and existing flows. Source/destination-check errors can</text><text x="1642" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">look like firewall policy drops.</text><text x="60" y="1492.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">REFERENCES — full clickable source links and validation commands are in the companion Markdown report.</text><text x="60" y="1539.44" font-family="Arial" font-size="21px" font-weight="400" fill="rgb(0, 0, 238)">https://docs.aws.amazon.com/vpc/latest/userguide/dynamic-routing-route-server.html</text><text x="60" y="1680.25" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Illustrative addresses • logical service hops • blue = initiating traffic • green = response • control-plane notes are not packet hops</text></svg>