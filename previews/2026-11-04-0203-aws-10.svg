<svg style="left: 0px; top: 0px; width: 100%; height: 100%; display: block; min-width: 2341px; min-height: 1706px; background: white;" xmlns="http://www.w3.org/2000/svg" width="2400" height="1740" viewBox="0 0 2400 1740"><g><g/><g><g style="visibility: visible;"><rect x="60" y="30" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="30" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="84" width="2280" height="76" rx="6.08" ry="6.08" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="84" width="2280" height="76" rx="6.08" ry="6.08" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="170" width="2280" height="50" rx="4" ry="4" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="170" width="2280" height="50" rx="4" ry="4" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="240" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="240" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="520" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="980" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1440" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1900" y="300" width="400" height="330" rx="26.4" ry="26.4" fill="#eff6ff" stroke="#80a9d5" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><path d="M 460 465 L 505.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 460 465 L 505.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 515.53 465 L 505.53 470 L 505.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 920 465 L 965.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 920 465 L 965.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 975.53 465 L 965.53 470 L 965.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1380 465 L 1425.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1380 465 L 1425.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1435.53 465 L 1425.53 470 L 1425.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1840 465 L 1885.53 465" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1840 465 L 1885.53 465" fill="none" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1895.53 465 L 1885.53 470 L 1885.53 460 Z" fill="#2466a8" stroke="#2466a8" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><rect x="60" y="680" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="680" width="2280" height="42" rx="3.36" ry="3.36" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="520" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="980" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1440" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1900" y="740" width="400" height="255" rx="20.4" ry="20.4" fill="#eef9f4" stroke="#77ad95" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><path d="M 520 867.5 L 474.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 520 867.5 L 474.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 464.47 867.5 L 474.47 862.5 L 474.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 980 867.5 L 934.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 980 867.5 L 934.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 924.47 867.5 L 934.47 862.5 L 934.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1440 867.5 L 1394.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1440 867.5 L 1394.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1384.47 867.5 L 1394.47 862.5 L 1394.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><path d="M 1900 867.5 L 1854.47 867.5" fill="none" stroke="white" stroke-width="12" stroke-miterlimit="10" pointer-events="stroke" visibility="hidden"/><path d="M 1900 867.5 L 1854.47 867.5" fill="none" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 1844.47 867.5 L 1854.47 862.5 L 1854.47 872.5 Z" fill="#25825b" stroke="#25825b" stroke-width="4" stroke-miterlimit="10" pointer-events="all"/></g><g style="visibility: visible;"><rect x="60" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#f2f0fa" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="840" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#fff7e7" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="1620" y="1060" width="720" height="365" rx="29.2" ry="29.2" fill="#fff0ef" stroke="#cbd5e1" stroke-width="2" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1470" width="2280" height="40" rx="3.2" ry="3.2" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1470" width="2280" height="40" rx="3.2" ry="3.2" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1520" width="2280" height="105" rx="8.4" ry="8.4" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1520" width="2280" height="105" rx="8.4" ry="8.4" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g><g style="visibility: visible;"><rect x="60" y="1660" width="2280" height="45" rx="3.6" ry="3.6" fill="none" stroke="white" pointer-events="stroke" visibility="hidden" stroke-width="9"/><rect x="60" y="1660" width="2280" height="45" rx="3.6" ry="3.6" fill="none" stroke="none" pointer-events="all"/></g><g style=""><g/></g></g><g/><g/></g><text x="60" y="52.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">AWS / PACKET INSPECTION ATLAS / 10 OF 12</text><text x="60" y="125.31" font-family="Arial" font-size="44px" font-weight="400" fill="rgb(21, 40, 63)">Network Firewall rules and TLS inspection</text><text x="60" y="194.3" font-family="Arial" font-size="26px" font-weight="400" fill="rgb(21, 40, 63)">Engine walk • logical processing stages rather than physical appliances</text><text x="60" y="262.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">FORWARD → Read steps 1–5 from left to right</text><text x="82" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">01 Stateless rules</text><text x="82" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Packets are evaluated against</text><text x="82" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">stateless rules and defaults.</text><text x="82" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">forward_to_sfe sends traffic to</text><text x="82" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">the stateful engine; a stateless</text><text x="82" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">pass can bypass that engine.</text><text x="542" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">02 Stateful stream</text><text x="542" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">The firewall tracks/reassembles</text><text x="542" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">supported flows. Strict-order</text><text x="542" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">and default-action-order policies</text><text x="542" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">evaluate rule groups differently;</text><text x="542" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">choose deliberately.</text><text x="1002" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">03 TLS inspection</text><text x="1002" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">For configured supported TLS</text><text x="1002" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">flows, the service terminates</text><text x="1002" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">and re-establishes TLS using the</text><text x="1002" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">TLS inspection configuration</text><text x="1002" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">and certificates.</text><text x="1462" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">04 Content verdict</text><text x="1462" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Suricata-compatible rules and</text><text x="1462" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">configured application/domain</text><text x="1462" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">criteria inspect available data.</text><text x="1462" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Encrypted bypass traffic has</text><text x="1462" y="500.59375" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">less visibility.</text><text x="1922" y="342.25" font-family="Arial" font-size="22px" font-weight="700" fill="rgb(21, 40, 63)">05 Forward or drop</text><text x="1922" y="395.03125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Allowed traffic continues along</text><text x="1922" y="421.421875" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">the endpoint route. A rule log</text><text x="1922" y="447.8125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">and a delivered response are</text><text x="1922" y="474.203125" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">different pieces of evidence.</text><text x="60" y="702.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">RETURN ← Start at step 6 on the right; follow steps 6–10 back to the source</text><text x="82" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">10 Client receive</text><text x="82" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">Client receives permitted data</text><text x="82" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">on the expected connection.</text><text x="542" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">09 Client TLS leg</text><text x="542" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">When decrypted, the service</text><text x="542" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">re-encrypts toward the client.</text><text x="1002" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">08 Reverse stream</text><text x="1002" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">Stateful processing evaluates</text><text x="1002" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">the reverse stream as</text><text x="1002" y="893.435" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">applicable.</text><text x="1462" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">07 Server TLS leg</text><text x="1462" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">The independent origin</text><text x="1462" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">session delivers the response</text><text x="1462" y="893.435" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">to the inspection service.</text><text x="1922" y="783.06" font-family="Arial" font-size="23px" font-weight="700" fill="rgb(21, 40, 63)">06 Server response</text><text x="1922" y="838.2475" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">Without TLS inspection,</text><text x="1922" y="865.84125" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">payload remains opaque even</text><text x="1922" y="893.435" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">though connection metadata</text><text x="1922" y="921.02875" font-family="Arial" font-size="23px" font-weight="400" fill="rgb(21, 40, 63)">is visible.</text><text x="82" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">ROUTING / CONTROL PLANE</text><text x="82" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Both directions must traverse the compatible firewall</text><text x="82" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">endpoint. Set HOME_NET and rule variables for all</text><text x="82" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">inspected source domains in centralized designs; the</text><text x="82" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">inspection VPC CIDR alone may not describe spoke</text><text x="82" y="1277.46125" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">clients.</text><text x="862" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">INSPECTION / IDENTITY</text><text x="862" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Strict-order drop-established defaults allow application</text><text x="862" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">identification before a final verdict in suitable designs.</text><text x="862" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Broad IP pass rules can prevent intended application</text><text x="862" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">restrictions. Validate the exact Suricata semantics of</text><text x="862" y="1277.46125" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">each rule.</text><text x="1642" y="1104.68" font-family="Arial" font-size="24px" font-weight="700" fill="rgb(21, 40, 63)">FAILURE / PROOF</text><text x="1642" y="1162.27375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">Test plaintext, decrypted TLS, unsupported/pinned</text><text x="1642" y="1191.070625" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">clients and an explicit deny. Verify certificate trust, TLS</text><text x="1642" y="1219.8675" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">logs, alert logs and application outcome. Do not use</text><text x="1642" y="1248.664375" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">real malware for acceptance tests.</text><text x="60" y="1492.68" font-family="Arial" font-size="24px" font-weight="400" fill="rgb(21, 40, 63)">REFERENCES — full clickable source links and validation commands are in the companion Markdown report.</text><text x="60" y="1539.44" font-family="Arial" font-size="21px" font-weight="400" fill="rgb(0, 0, 238)">https://docs.aws.amazon.com/network-firewall/latest/developerguide/firewall-rules-engines.html</text><text x="60" y="1564.6275" font-family="Arial" font-size="21px" font-weight="400" fill="rgb(0, 0, 238)">https://docs.aws.amazon.com/network-firewall/latest/developerguide/tls-inspection.html</text><text x="60" y="1680.25" font-family="Arial" font-size="22px" font-weight="400" fill="rgb(21, 40, 63)">Illustrative addresses • logical service hops • blue = initiating traffic • green = response • control-plane notes are not packet hops</text></svg>